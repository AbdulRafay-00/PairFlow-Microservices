name: Java CI with Maven

on:
  push:
    branches: [ "feature-k8s-deployment" ]
    paths:
      - 'Service-Registry/**'
      - '.github/workflows/Service-Registry.yaml'
  # pull_request:
  #   branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    # runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn clean package -DskipTests
      working-directory: ./Service-Registry

    - name: Login to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}

        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      if: github.event_name == 'push'
      uses: docker/build-push-action@v7
      with:
        context: ./Service-Registry
        push: true
        tags: |
          ${{ vars.DOCKERHUB_USERNAME }}/pairflow-service-registry-repo:latest
          ${{ vars.DOCKERHUB_USERNAME }}/pairflow-service-registry-repo:1.0.${{ github.run_number }}