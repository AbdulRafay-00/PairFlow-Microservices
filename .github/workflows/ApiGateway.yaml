name: Java CI with Maven

on:
  push:
    branches: ["feature-k8s-deployment"]
    paths:
      - 'Api-Gateway/**'
      - '.github/workflows/api-gateway/ApiGateway.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests
        working-directory: API-Gateway

      - name: Login to docker hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
        username: ${{ vars.DOCKERHUB_USERNAME }}

        password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: build and push docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: API-Gateway
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/pairflow-api-gateway-repo:latest
            ${{ vars.DOCKERHUB_USERNAME }}/pairflow-api-gateway-repo:1.0.${{ github.run_number }}
