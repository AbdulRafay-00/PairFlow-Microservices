
name: Java CI with Maven

on:
  push:
    branches: [ "feature-k8s-deployment" ]
    paths:
      - 'user-service/**'
      - '.github/workflows/user-service.yml'
  # pull_request:
  #   branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    # runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn clean package -DskipTests
      working-directory: ./user-service

    - name: Login to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}

        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      if: github.event_name == 'push'
      uses: docker/build-push-action@v7
      with:
        context: ./user-service
        push: true
        tags: |
          ${{ vars.DOCKERHUB_USERNAME }}/user-service-repo:latest
          ${{ vars.DOCKERHUB_USERNAME }}/user-service-repo:1.0.${{ github.run_number }}
    # latest in tag 1 is just a tag to show it can be any name of your choice
