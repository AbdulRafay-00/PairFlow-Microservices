apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-mysql-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tinder-user-service-mysql-pod
  template:
    metadata:
      labels:
        app: tinder-user-service-mysql-pod
    spec:
      containers:
        - name: tinder-user-service-mysql
          image: mysql:8.0.43
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: tinder_user_service
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
