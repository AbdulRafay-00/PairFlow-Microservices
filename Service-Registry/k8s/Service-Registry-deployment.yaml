apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-registry-deployment
  labels:
    app: service-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pairflow-service-registry-pod
  template:
    metadata:
      labels:
        app: pairflow-service-registry-pod
    spec:
      containers:
      - name: pairflow-service-registry
        image: rafayabdul00/pairflow-service-registry-repo:latest
        ports:
        - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: eurika-service-registry-service
spec:
  type: NodePort
  selector:
    app: pairflow-service-registry-pod
  ports:

    - protocol: TCP
      port: 8761
      targetPort: 8761
      nodePort: 30001